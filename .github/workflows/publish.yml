name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=false --ignore-scripts
          fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Check tag version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v$VERSION"
            if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version $VERSION."
              echo "Expected tag: $expected_tag"
              exit 1
            fi
          fi

      - name: Check package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@wpmoo/odoo-skills@$VERSION" version >/dev/null 2>&1; then
            echo "@wpmoo/odoo-skills@$VERSION already exists on npm."
            echo "Bump package.json before publishing."
            exit 1
          fi

      - name: Check package dry run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
